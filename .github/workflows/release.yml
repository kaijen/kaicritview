name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Version is taken from the git tag (strip the leading "v"), matching the
      # scheme used in kaijen/kaicrit. We write it into package.json without
      # creating a commit/tag (the tag already exists) so vsce packages it as-is.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # No build step or dependencies: this extension is plain JS, so vsce
      # packages the sources directly.
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
